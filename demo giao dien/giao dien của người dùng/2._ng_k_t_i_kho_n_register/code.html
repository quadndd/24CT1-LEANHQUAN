<!DOCTYPE html>

<html lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f9f9ff;}body{overscroll-behavior:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "error": "#ba1a1a", "primary": "#006e2e", "surface-container-highest": "#dce2f3", "error-container": "#ffdad6", "inverse-on-surface": "#ebf1ff", "on-error": "#ffffff", "surface-container": "#e7eefe", "on-background": "#151c27", "surface-tint": "#006e2e", "on-tertiary-container": "#323131", "surface-bright": "#f9f9ff", "primary-fixed-dim": "#52e078", "surface": "#f9f9ff", "tertiary-fixed": "#e5e2e1", "surface-container-lowest": "#ffffff", "on-primary-container": "#003a15", "tertiary-fixed-dim": "#c8c6c5", "surface-dim": "#d3daea", "tertiary-container": "#9b9999", "outline": "#6d7b6c", "on-tertiary-fixed-variant": "#474746", "on-primary": "#ffffff", "on-secondary-fixed": "#002109", "primary-fixed": "#71fe91", "inverse-primary": "#52e078", "on-secondary": "#ffffff", "on-surface": "#151c27", "secondary": "#006d2f", "on-primary-fixed-variant": "#005321", "surface-container-high": "#e2e8f8", "surface-variant": "#dce2f3", "on-secondary-container": "#007433", "on-primary-fixed": "#002109", "inverse-surface": "#2a313d", "on-tertiary-fixed": "#1c1b1b", "background": "#f9f9ff", "tertiary": "#5f5e5e", "on-tertiary": "#ffffff", "secondary-fixed-dim": "#6add84", "secondary-container": "#87fb9d", "surface-container-low": "#f0f3ff", "on-secondary-fixed-variant": "#005322", "secondary-fixed": "#87fb9d", "on-surface-variant": "#3d4a3d", "primary-container": "#00b14f", "outline-variant": "#bccbb9", "on-error-container": "#93000a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "pill-padding-y": "8px", "sheet-bottom-safe": "34px", "card-gap": "12px", "screen-edge": "16px", "touch-lg": "56px", "inner-padding": "16px", "pill-padding-x": "14px", "touch-min": "48px" }, fontFamily: { "label-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "display-income": ["Inter"], "body-md": ["Inter"], "label-prominent": ["Inter"], "headline-timer": ["Inter"] }, fontSize: { "label-md": ["13px", {"lineHeight": "18px", "fontWeight": "600"}], "headline-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600"}], "body-lg": ["16px", {"lineHeight": "22px", "fontWeight": "500"}], "headline-md": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "display-income": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "label-prominent": ["15px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700"}], "headline-timer": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-screen-edge pb-sheet-bottom-safe">
<!-- Top Navigation & Brand Header -->
<div class="flex items-center justify-between py-3">
<button aria-label="Quay lại" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-2 pr-1">
<img alt="Ride-hailing brand logo" class="w-10 h-10 object-contain rounded-xl shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1UadSbZ_GnbE6Q-ZKhr0EChZXzbtEbeYAW-Iwhjn4zpQ8iHYEETKVgsikXfQOjxFdBDPUje1d7j4de1TgAqJPc7aXJ5dfcu-4GxE4OsxnhV20IzJWLpYBFTtIPxzSfkiJZDkNxwjh_tNDV-Ac-3ucmooXAIaeGtIZvEx9RRXDZipVO5dt4iBc5IKGRjTPy-Hv7MlJR4Bm2sABA3beS8HfDrZOI2qipHwX9ACC3sY2IBOwYCTtkNFBWibA"/>
</div>
</div>
<!-- Hero Typography Section -->
<div class="mt-4 mb-6">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm mb-3">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span>Trải nghiệm di chuyển xanh</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Tạo tài khoản mới</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Đăng ký để trải nghiệm đặt xe nhanh chóng</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-card-gap" onsubmit="event.preventDefault();">
<!-- Họ và tên -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface">Họ và tên</label>
<div class="flex items-center h-[52px] px-inner-padding rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-[22px]">person</span>
<input class="w-full bg-transparent text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" placeholder="Nguyễn Thu Hà" required="" type="text"/>
</div>
</div>
<!-- Số điện thoại -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface">Số điện thoại</label>
<div class="flex items-center h-[52px] px-inner-padding rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<div class="flex items-center gap-1.5 pr-3 mr-3 bg-surface-container-high/60 py-1.5 px-2.5 rounded-lg">
<span class="text-base leading-none">🇻🇳</span>
<span class="font-label-md text-label-md text-on-surface">+84</span>
</div>
<input class="w-full bg-transparent text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" placeholder="0912 888 999" required="" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface">Email</label>
<div class="flex items-center h-[52px] px-inner-padding rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-[22px]">mail</span>
<input class="w-full bg-transparent text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" placeholder="ha.nguyen@example.com" required="" type="email"/>
</div>
</div>
<!-- Mật khẩu -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface">Mật khẩu</label>
<div class="flex items-center h-[52px] px-inner-padding rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-[22px]">lock</span>
<input class="w-full bg-transparent text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" id="register-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Hiện mật khẩu" class="p-1 text-outline hover:text-on-surface transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Xác nhận mật khẩu -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface">Xác nhận mật khẩu</label>
<div class="flex items-center h-[52px] px-inner-padding rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-[22px]">lock</span>
<input class="w-full bg-transparent text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" id="register-confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Checkbox Điều khoản -->
<div class="pt-2">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center mt-0.5">
<input checked="" class="peer sr-only" id="terms-checkbox" type="checkbox"/>
<div class="w-5 h-5 rounded-lg bg-surface-container-high peer-checked:bg-primary transition-all flex items-center justify-center shadow-sm group-active:scale-95">
<span class="material-symbols-outlined text-[16px] text-on-primary font-bold">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant leading-tight select-none">
          Tôi đồng ý với 
          <a class="font-label-md text-label-md text-primary underline underline-offset-2" href="#">Điều khoản dịch vụ</a> 
          và 
          <a class="font-label-md text-label-md text-primary underline underline-offset-2" href="#">Chính sách bảo mật</a>
</span>
</label>
</div>
<!-- Nút Đăng ký chính -->
<button class="mt-4 w-full h-[56px] rounded-xl bg-primary-container hover:bg-primary text-on-primary font-label-prominent text-label-prominent flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.99] transition-all" type="submit">
<span>Đăng ký tài khoản</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-6 mb-2 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Đã có tài khoản? 
      <a class="font-label-prominent text-label-prominent text-primary hover:underline underline-offset-2 ml-1" href="#">Đăng nhập ngay</a>
</p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('register-password');
    const icon = document.getElementById('password-icon');
    
    if (toggleBtn && pwdInput && icon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
</script></main></body></html>
